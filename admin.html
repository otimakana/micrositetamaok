<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Widya Pratama Class</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="admin-body"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">WP</span><span><b>WIDYA PRATAMA</b><small>ADMIN CONSOLE</small></span></a><nav><a href="index.html">← Public Library</a><button id="themeBtn" class="icon-btn">☾</button></nav></header><main class="admin-main"><section id="loginView" class="auth-card"><span class="eyebrow">ADMIN ACCESS</span><h1>Kelola perpustakaan.</h1><p>Masuk untuk menambah, mengedit, atau menghapus resource.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Masuk</button><p id="loginError" class="error"></p></form></section><section id="dashboardView" class="hidden"><div class="admin-head"><div><span class="eyebrow">ADMIN CONSOLE</span><h1>Library Manager</h1></div><button id="logoutBtn" class="btn ghost">Keluar</button></div><div class="admin-stats"><div><small>Total Materi</small><strong id="aTotal">—</strong></div><div><small>Published</small><strong id="aPublished">—</strong></div><div><small>Draft</small><strong id="aDraft">—</strong></div><div><small>Kategori</small><strong id="aCategories">—</strong></div></div><div class="admin-toolbar"><button id="newMaterialBtn" class="btn primary">＋ Tambah Materi</button><label class="search admin-search"><span>⌕</span><input id="adminSearch" placeholder="Cari materi…"></label></div><div class="table-wrap"><table><thead><tr><th>Materi</th><th>Kategori</th><th>Jenis</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="materialsTable"></tbody></table></div></section></main>
  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">RESOURCE EDITOR</span><h2 id="modalTitle">Tambah Materi</h2></div><button id="closeModal" class="icon-btn">×</button></div><form id="materialForm" class="form-grid"><input id="materialId" type="hidden"><label class="full">Judul<input id="title" name="title" required></label><label class="full">Deskripsi<textarea id="description" name="description" rows="3"></textarea></label><label>Kategori<select id="category" name="category" required></select></label><label>Jenis Materi<select id="materialType" name="materialType" required></select></label><label>Mata Pelajaran<input id="subject" name="subject" value="Kimia"></label><label>Kelas<input id="grade" name="grade" placeholder="XII"></label><label>Semester<input id="semester" name="semester" placeholder="Ganjil"></label><label>Thumbnail URL<input id="thumbnailUrl" name="thumbnailUrl" type="url"></label><label class="full">Resource URL<input id="resourceUrl" name="resourceUrl" type="url" placeholder="https://..."></label><label class="full">External URL<input id="externalUrl" name="externalUrl" type="url" placeholder="https://..."></label><label class="full">Tags <small>pisahkan dengan koma</small><input id="tags" name="tags" placeholder="redoks, elektrokimia, interaktif"></label><label class="check"><input id="featured" type="checkbox"> Featured</label><label class="check"><input id="published" type="checkbox" checked> Published</label><div class="form-actions full"><button type="button" id="cancelModal" class="btn ghost">Batal</button><button type="submit" class="btn primary">Simpan Materi</button></div><p id="formError" class="error full"></p></form></div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/admin.js"></script></body></html>
